<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lista de Mercado</title>
<style>
:root{--g:#2e7d32;--g2:#e8f5e9;--bg:#f6f7f6;--tx:#1d1d1d;--mut:#6b6b6b;--line:#e3e3e3;--red:#c62828}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;flex:1}
header .hbtn{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:14px}
header .hbtn.on{background:#fff;color:var(--g)}
main{padding:12px 12px calc(90px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button span{font-size:22px}
nav button.on{color:var(--g);font-weight:600}
#badge{position:absolute;top:4px;left:55%;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;font-weight:700}
#badge:empty{display:none}
.search{width:100%;padding:13px 14px;font-size:17px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.search:focus{border-color:var(--g)}
.info{color:var(--mut);font-size:14px;margin:10px 4px}
details{background:#fff;border-radius:12px;margin:8px 0;border:1px solid var(--line);overflow:hidden}
summary{padding:13px 14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary .n{margin-left:auto;background:var(--g);color:#fff;border-radius:10px;font-size:12px;padding:2px 8px}
summary::after{content:"›";color:var(--mut);font-size:22px;transform:rotate(90deg);transition:.15s}
details[open] summary::after{transform:rotate(-90deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 14px}
.chip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border:1px solid var(--line);background:#fafafa;border-radius:20px;padding:9px 13px;font-size:15px;color:var(--tx)}
.chip.sel{background:var(--g);border-color:var(--g);color:#fff}
.chip.sel::before{content:"✓ "}
.chip .qt{background:rgba(255,255,255,.25);border-radius:10px;padding:1px 7px;margin-left:6px;font-size:13px;font-weight:700}
.chip.ed{border-style:dashed}
.addnew{width:100%;margin-top:10px;padding:14px;border:2px dashed var(--g);background:var(--g2);color:var(--g);border-radius:12px;font-size:16px;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.ghead{padding:10px 14px 4px;font-size:13px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.3px}
.row{display:flex;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid #f0f0f0}
.ghead + .row{border-top:0}
.grow{flex:1;min-width:0}
.grow small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.ib{border:0;background:#f1f1f1;border-radius:10px;width:40px;height:40px;font-size:17px;flex:none}
.big{display:flex;align-items:center;gap:12px;padding:16px 14px;border-top:1px solid #f0f0f0;font-size:19px;min-height:62px}
.ghead + .big{border-top:0}
.box{width:30px;height:30px;border:2px solid #9e9e9e;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.big.done{color:#9e9e9e}
.big.done .nm{text-decoration:line-through}
.big.done .box{background:var(--g);border-color:var(--g)}
.pbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:14px;color:var(--mut);flex:none;min-width:58px}
.pbtn.has{color:var(--g);border-color:var(--g);font-weight:600}
.prog{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:10px;background:#eee;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;background:var(--g);color:#fff;margin:8px 0;text-align:center;text-decoration:none}
.btn.sec{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn.red{background:#fff;color:var(--red);border:1px solid var(--red)}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
.empty b{display:block;font-size:44px;margin-bottom:8px}
h2{font-size:15px;margin:22px 4px 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
input.f,textarea.f,select.f{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#fff;font-family:inherit}
textarea.f{height:110px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:19px}
.catpick{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.catpick button{border:1px solid var(--line);background:#fafafa;border-radius:20px;padding:9px 12px;font-size:14px}
.catpick button.sel{background:var(--g);color:#fff;border-color:var(--g)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.quick button{border:1px solid var(--line);background:#fafafa;border-radius:16px;padding:7px 12px;font-size:14px}
.cands{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.cands button{border:2px solid var(--g);background:var(--g2);color:var(--g);border-radius:12px;padding:10px 14px;font-size:18px;font-weight:700}
#toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:15;background:#323232;color:#fff;border-radius:12px;padding:12px 14px;display:none;align-items:center;gap:10px;font-size:15px}
#toast.show{display:flex}
#toast span{flex:1}
#toast button{background:none;border:0;color:#81c784;font-weight:700;font-size:15px;padding:4px 6px}
.banner{background:#fff8e1;border:1px solid #ffe082;border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:15px}
.total{font-weight:700;color:var(--g);white-space:nowrap}
.muted{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<header><h1 id="title">🛒 Lista de Mercado</h1><span id="hright"></span></header>
<main id="main"></main>
<nav>
  <button data-tab="montar"><span>📝</span>Montar</button>
  <button data-tab="lista"><span>📋</span>Lista<i id="badge"></i></button>
  <button data-tab="mercado"><span>🛒</span>Mercado</button>
  <button data-tab="mais"><span>⚙️</span>Mais</button>
</nav>
<div id="modal"></div>
<div id="toast"><span id="tmsg"></span><button id="tundo">DESFAZER</button></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>

<script>
"use strict";
/* ================= LISTA MESTRE INICIAL ================= */
const SEED=[
 ["hort","🥬","Hortifruti","Alface,Tomate,Cebola,Alho,Batata,Batata-doce,Cenoura,Beterraba,Pepino,Pimentão,Abobrinha,Chuchu,Brócolis,Couve,Repolho,Mandioca,Cheiro-verde,Limão,Banana,Maçã,Laranja,Mamão,Melancia,Melão,Uva,Abacate,Morango,Ovos"],
 ["pada","🥖","Padaria","Pão francês,Pão de forma,Pão integral,Bisnaguinha,Cuca,Bolo,Torrada,Rosca"],
 ["frio","🧀","Frios e Laticínios","Leite,Queijo mussarela,Presunto,Mortadela,Salame,Requeijão,Manteiga,Margarina,Iogurte,Nata,Creme de leite,Queijo ralado"],
 ["carn","🥩","Carnes","Carne moída,Bife,Peito de frango,Coxa e sobrecoxa,Carne de porco,Costela,Linguiça,Salsicha,Bacon,Peixe"],
 ["merc","🍚","Mercearia","Arroz,Feijão,Macarrão,Farinha de trigo,Fubá,Açúcar,Sal,Óleo,Azeite,Vinagre,Molho de tomate,Extrato de tomate,Milho em lata,Ervilha em lata,Atum,Sardinha,Maionese,Ketchup,Mostarda,Tempero pronto,Caldo de galinha,Leite condensado,Fermento,Aveia,Farofa pronta,Pipoca,Biscoito recheado,Bolacha água e sal,Chocolate"],
 ["mati","☕","Matinais","Café,Achocolatado,Cereal,Granola,Chá,Adoçante,Geleia,Leite em pó"],
 ["bebi","🥤","Bebidas","Água mineral,Água com gás,Refrigerante,Suco,Suco em pó,Cerveja,Vinho"],
 ["cong","🧊","Congelados","Pizza congelada,Lasanha,Batata frita congelada,Hambúrguer,Nuggets,Pão de queijo,Polpa de fruta,Sorvete"],
 ["limp","🧽","Limpeza","Detergente,Sabão em pó,Sabão líquido,Amaciante,Água sanitária,Desinfetante,Multiuso,Limpa-vidros,Álcool,Esponja,Pano de chão,Saco de lixo,Papel toalha,Papel alumínio,Filme plástico,Guardanapo"],
 ["higi","🧴","Higiene","Papel higiênico,Sabonete,Shampoo,Condicionador,Creme dental,Escova de dente,Fio dental,Desodorante,Absorvente,Cotonete,Algodão,Lâmina de barbear,Protetor solar"],
 ["pet","🐾","Pet","Ração,Petisco,Areia sanitária"],
 ["outr","📦","Outros","Pilha,Lâmpada,Fósforo,Vela,Carvão"]
];
const KEY="listaMercado.v1";
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dtf=iso=>{const d=new Date(iso);return d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};

function seed(){
  const s={v:1,name:"",cats:[],master:[],current:newList(),history:[]};
  SEED.forEach(([id,emo,name,items])=>{
    s.cats.push({id,emo,name});
    items.split(",").forEach(n=>s.master.push({id:uid(),name:n,cat:id}));
  });
  return s;
}
function newList(){return{created:new Date().toISOString(),items:[]}}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.cats)S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
// pede ao navegador para não apagar os dados
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ================= ESTADO DA TELA ================= */
let tab="montar",q="",editMode=false,openCats=new Set(),view=null;
const cat=id=>S.cats.find(c=>c.id===id)||S.cats.find(c=>c.id==="outr")||S.cats[S.cats.length-1];
const inList=mid=>S.current.items.find(i=>i.mid===mid);
function grouped(items){
  const ids=new Set(S.cats.map(c=>c.id));
  return S.cats.map(c=>({c,items:items.filter(i=>(ids.has(i.cat)?i.cat:cat(i.cat).id)===c.id)})).filter(g=>g.items.length);
}
function itemSub(i){return[i.qty,i.note].filter(Boolean).map(esc).join(" · ")}

/* ================= RENDER ================= */
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab&&!view));
  const pend=S.current.items.filter(i=>!i.done).length;
  $("#badge").textContent=pend||"";
  $("#hright").innerHTML=(tab==="montar"&&!view)?`<button class="hbtn ${editMode?"on":""}" data-act="editMode">${editMode?"✓ Pronto":"✎ Editar"}</button>`:"";
  const m=$("#main");
  if(view)m.innerHTML=rView();
  else if(tab==="montar"){m.innerHTML=rMontar();}
  else if(tab==="lista")m.innerHTML=rLista();
  else if(tab==="mercado")m.innerHTML=rMercado();
  else m.innerHTML=rMais();
  wake(tab==="mercado"&&!view);
}

function rMontar(){
  return `<input class="search" id="q" type="search" placeholder="🔎 Buscar ou adicionar item..." value="${esc(q)}" autocomplete="off">
  <div class="info" id="cnt"></div><div id="res">${rRes()}</div>`;
}
function rRes(){
  const n=S.current.items.length;
  setTimeout(()=>{const c=$("#cnt");if(c)c.textContent=editMode?"Modo edição: toque num item para renomear, mudar de categoria ou excluir.":(n?`${n} ${n>1?"itens":"item"} na lista · segure um item para pôr quantidade`:"Toque para adicionar · segure para escolher a quantidade")},0);
  const chip=it=>{const li=inList(it.id);return `<button class="chip ${li?"sel":""} ${editMode?"ed":""}" data-act="chip" data-id="${it.id}">${esc(it.name)}${li&&li.qty?`<span class="qt">${esc(li.qty)}</span>`:""}</button>`};
  if(q.trim()){
    const nq=norm(q);
    const found=S.master.filter(it=>norm(it.name).includes(nq));
    const exact=S.master.some(it=>norm(it.name)===nq);
    let h="";
    grouped(found).forEach(g=>{h+=`<div class="card"><div class="ghead">${g.c.emo} ${esc(g.c.name)}</div><div class="chips" style="padding-top:6px">${g.items.map(chip).join("")}</div></div>`});
    if(!found.length)h+=`<div class="info">Nenhum item com “${esc(q)}”.</div>`;
    if(!exact)h+=`<button class="addnew" data-act="addNew">＋ Adicionar “${esc(q.trim())}”</button>`;
    return h;
  }
  return S.cats.map(c=>{
    const its=S.master.filter(it=>it.cat===c.id).sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));
    const sel=its.filter(it=>inList(it.id)).length;
    return `<details data-cat="${c.id}" ${openCats.has(c.id)?"open":""}><summary>${c.emo} ${esc(c.name)} ${sel?`<span class="n">${sel}</span>`:""}</summary>
    <div class="chips">${its.map(chip).join("")||'<span class="muted">Nenhum item</span>'}</div></details>`;
  }).join("");
}
function refreshMontar(){const r=$("#res");if(r)r.innerHTML=rRes();const pend=S.current.items.filter(i=>!i.done).length;$("#badge").textContent=pend||""}

function rLista(){
  const L=S.current.items;
  if(!L.length)return `<div class="empty"><b>📋</b>Sua lista está vazia.<br>Vá em <b style="display:inline;font-size:inherit">Montar</b> e toque nos itens.</div>`;
  let h=`<div class="info">Lista iniciada em ${dtf(S.current.created)} · ${L.length} ${L.length>1?"itens":"item"}</div>`;
  grouped(L).forEach(g=>{
    h+=`<div class="card"><div class="ghead">${g.c.emo} ${esc(g.c.name)}</div>`+g.items.map(i=>`<div class="row"><div class="grow"><span style="${i.done?"text-decoration:line-through;color:#9e9e9e":""}">${esc(i.name)}</span><small>${itemSub(i)}</small></div>
      <button class="ib" data-act="edit" data-id="${i.mid}">✎</button><button class="ib" data-act="rm" data-id="${i.mid}">✕</button></div>`).join("")+`</div>`;
  });
  h+=`<h2>Compartilhar</h2>
  <button class="btn" data-act="share">📲 Enviar para o app de outra pessoa</button>
  <button class="btn sec" data-act="shareText">💬 Enviar como texto (WhatsApp)</button>
  <h2>Terminou?</h2>
  <button class="btn red" data-act="newList">🔄 Começar nova lista</button>
  <div class="muted" style="margin:4px">A lista atual vai para o histórico (ficam as 2 últimas).</div>`;
  return h;
}

function rMercado(){
  const L=S.current.items;
  if(!L.length)return `<div class="empty"><b>🛒</b>Nada para comprar ainda.<br>Monte sua lista primeiro.</div>`;
  const done=L.filter(i=>i.done),pend=L.filter(i=>!i.done);
  const tot=L.reduce((s,i)=>s+(i.price||0),0);
  const row=i=>`<div class="big ${i.done?"done":""}" data-act="check" data-id="${i.mid}"><div class="box">${i.done?"✓":""}</div>
    <div class="grow"><span class="nm">${esc(i.name)}</span>${itemSub(i)?`<small>${itemSub(i)}</small>`:""}</div>
    <button class="pbtn ${i.price?"has":""}" data-act="price" data-id="${i.mid}">${i.price?brl(i.price):"R$"}</button></div>`;
  let h=`<div class="prog"><b>${done.length}/${L.length}</b><div class="bar"><i style="width:${Math.round(done.length/L.length*100)}%"></i></div>${tot?`<span class="total">${brl(tot)}</span>`:""}</div>`;
  if(!pend.length)h+=`<div class="empty" style="padding:24px"><b>🎉</b>Compra concluída!</div><button class="btn" data-act="newList">🔄 Começar nova lista</button>`;
  grouped(pend).forEach(g=>{h+=`<div class="card"><div class="ghead">${g.c.emo} ${esc(g.c.name)}</div>${g.items.map(row).join("")}</div>`});
  if(done.length)h+=`<h2>No carrinho (${done.length})</h2><div class="card">${done.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).map(row).join("")}</div>
   <div class="muted" style="margin:4px">Tocou sem querer? Toque de novo no item para voltar.</div>`;
  return h;
}

function rMais(){
  const H=S.history;
  let h=`<h2>Seu nome</h2><input class="f" id="nm" placeholder="Ex: Nilson (aparece quando você envia uma lista)" value="${esc(S.name)}">
  <h2>Histórico (últimas 2 listas)</h2>`;
  h+=H.length?`<div class="card">`+H.map((l,ix)=>`<div class="row"><div class="grow">${dtf(l.created)}<small>${l.items.length} itens${l.from?" · recebida de "+esc(l.from):""}</small></div>
     <button class="ib" data-act="histView" data-i="${ix}">👁</button><button class="ib" data-act="histUse" data-i="${ix}">↩</button></div>`).join("")+`</div>
     <div class="muted" style="margin:4px">👁 ver · ↩ voltar a usar essa lista</div>`:`<div class="muted" style="margin:4px">Nenhuma lista anterior ainda.</div>`;
  h+=`<h2>Ordem dos corredores</h2><div class="muted" style="margin:4px 4px 6px">Coloque as categorias na ordem em que você anda no seu mercado.</div><div class="card">`+
   S.cats.map((c,ix)=>`<div class="row"><div class="grow">${c.emo} ${esc(c.name)}</div>
   <button class="ib" data-act="catUp" data-i="${ix}" ${ix?"":"disabled style='opacity:.3'"}>↑</button>
   <button class="ib" data-act="catDown" data-i="${ix}" ${ix<S.cats.length-1?"":"disabled style='opacity:.3'"}>↓</button>
   <button class="ib" data-act="catEdit" data-i="${ix}">✎</button></div>`).join("")+`</div>
   <button class="btn sec" data-act="catAdd">＋ Nova categoria</button>
  <h2>Backup</h2><div class="muted" style="margin:4px">Os dados ficam só neste celular. Guarde uma cópia de vez em quando (ex: mande para você no WhatsApp).</div>
  <div class="btns"><button class="btn sec" data-act="backup">Copiar backup</button><button class="btn sec" data-act="restore">Restaurar</button></div>
  <div class="muted" style="text-align:center;margin:20px 0">Lista de Mercado v1.1 · ${S.master.length} itens na lista mestre</div>`;
  return h;
}

function rView(){
  const L=view.items;
  const row=(i,ix)=>`<div class="big ${i.done?"done":""}" data-act="viewCheck" data-i="${ix}"><div class="box">${i.done?"✓":""}</div><div class="grow"><span class="nm">${esc(i.name)}</span>${itemSub(i)?`<small>${itemSub(i)}</small>`:""}</div></div>`;
  let h=`<div class="banner">👁 <b>${view.hist?"Lista do histórico":"Lista recebida"+(view.from?" de "+esc(view.from):"")}</b> · somente leitura. As marcações aqui não são salvas.</div>`;
  const idx=L.map((i,ix)=>({...i,ix}));
  grouped(idx).forEach(g=>{h+=`<div class="card"><div class="ghead">${g.c.emo} ${esc(g.c.name)}</div>${g.items.map(i=>row(i,i.ix)).join("")}</div>`});
  h+=view.hist?`<button class="btn" data-act="histUse" data-i="${view.hi}">↩ Voltar a usar esta lista</button>`:`<button class="btn" data-act="imp">📥 Importar para minha lista</button>`;
  h+=`<button class="btn sec" data-act="viewClose">Fechar</button>`;
  return h;
}

/* ================= MODAL / TOAST ================= */
function openModal(html){const m=$("#modal");m.innerHTML=`<div class="sheet">${html}</div>`;m.classList.add("show")}
function closeModal(){const m=$("#modal");m.classList.remove("show");m.innerHTML=""}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
let tTimer,tUndo=null;
function toast(msg,undo){$("#tmsg").textContent=msg;tUndo=undo||null;$("#tundo").style.display=undo?"":"none";$("#toast").classList.add("show");clearTimeout(tTimer);tTimer=setTimeout(()=>{$("#toast").classList.remove("show");tUndo=null},5000)}
$("#tundo").onclick=()=>{if(tUndo){tUndo();tUndo=null}$("#toast").classList.remove("show")};
function catPicker(sel){return `<div class="catpick">${S.cats.map(c=>`<button data-act="pickCat" data-cat="${c.id}" class="${c.id===sel?"sel":""}">${c.emo} ${esc(c.name)}</button>`).join("")}</div>`}
let pickedCat=null;

/* ================= AÇÕES ================= */
function snapshot(list,from){
  if(!list.items.length)return;
  const copy=JSON.parse(JSON.stringify(list));if(from)copy.from=from;
  S.history.unshift(copy);S.history=S.history.slice(0,2);
}
function addToList(it){S.current.items.push({mid:it.id,name:it.name,cat:it.cat,qty:"",note:"",done:false,price:null})}

const A={
  editMode(){editMode=!editMode;render()},
  chip(el){
    const it=S.master.find(x=>x.id===el.dataset.id);if(!it)return;
    if(editMode){pickedCat=it.cat;openModal(`<h3>Editar item</h3><input class="f" id="en" value="${esc(it.name)}"><div class="muted">Categoria:</div>${catPicker(it.cat)}
      <button class="btn" data-act="mEditSave" data-id="${it.id}">Salvar</button><button class="btn red" data-act="mDel" data-id="${it.id}">Excluir da lista mestre</button>`);return}
    const ex=inList(it.id);
    if(ex){const pos=S.current.items.indexOf(ex);S.current.items.splice(pos,1);save();refreshMontar();toast(`Removido: ${it.name}`,()=>{S.current.items.splice(pos,0,ex);save();refreshMontar()})}
    else{addToList(it);save();refreshMontar()}
  },
  addNew(){pickedCat=null;openModal(`<h3>Novo item</h3><input class="f" id="en" value="${esc(q.trim())}"><div class="muted">Em qual categoria?</div>${catPicker(null)}
    <button class="btn" data-act="saveNew">Adicionar à lista</button><div class="muted">Ele também fica salvo na lista mestre para as próximas vezes.</div>`)},
  pickCat(el){pickedCat=el.dataset.cat;document.querySelectorAll(".catpick button").forEach(b=>b.classList.toggle("sel",b===el))},
  saveNew(){
    const n=$("#en").value.trim();if(!n)return;
    const it={id:uid(),name:n,cat:pickedCat||"outr"};
    if(!S.cats.some(c=>c.id===it.cat))it.cat=S.cats[S.cats.length-1].id;
    S.master.push(it);addToList(it);save();closeModal();q="";render();toast(`Adicionado: ${n}`);
  },
  mEditSave(el){
    const it=S.master.find(x=>x.id===el.dataset.id);const n=$("#en").value.trim();if(!it||!n)return;
    it.name=n;if(pickedCat)it.cat=pickedCat;
    const li=inList(it.id);if(li){li.name=n;li.cat=it.cat}
    save();closeModal();render();
  },
  mDel(el){
    const ix=S.master.findIndex(x=>x.id===el.dataset.id);if(ix<0)return;
    const it=S.master.splice(ix,1)[0];save();closeModal();render();
    toast(`Excluído: ${it.name}`,()=>{S.master.splice(ix,0,it);save();render()});
  },
  edit(el){
    const i=inList(el.dataset.id)||(()=>{const m=S.master.find(x=>x.id===el.dataset.id);return m&&{mid:m.id,name:m.name,qty:"",note:"",isNew:true}})();if(!i)return;
    const qk=["2","3","4","6","12","1 kg","500 g","1 pacote","1 caixa"];
    openModal(`<h3>${esc(i.name)}</h3><div class="muted">Quantidade</div><input class="f" id="eq" value="${esc(i.qty)}" placeholder="Ex: 2, 1 kg, 1 pacote">
      <div class="quick">${qk.map(x=>`<button data-act="qk" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <div class="muted">Observação</div><input class="f" id="eo" value="${esc(i.note)}" placeholder="Ex: marca Ypê, o maior">
      <button class="btn" data-act="editSave" data-id="${i.mid}">${i.isNew?"Adicionar à lista":"Salvar"}</button>${!i.isNew&&tab==="montar"?`<button class="btn red" data-act="rmFromModal" data-id="${i.mid}">Tirar da lista</button>`:""}`);
  },
  qk(el){$("#eq").value=el.dataset.v},
  editSave(el){
    let i=inList(el.dataset.id);
    if(!i){const m=S.master.find(x=>x.id===el.dataset.id);if(!m)return;addToList(m);i=inList(m.id)}
    i.qty=$("#eq").value.trim();i.note=$("#eo").value.trim();save();closeModal();
    if(tab==="montar"&&!view)refreshMontar();else render();
  },
  rmFromModal(el){closeModal();A.chip(el)},
  rm(el){
    const i=inList(el.dataset.id);if(!i)return;const pos=S.current.items.indexOf(i);
    S.current.items.splice(pos,1);save();render();toast(`Removido: ${i.name}`,()=>{S.current.items.splice(pos,0,i);save();render()});
  },
  check(el){
    const i=inList(el.dataset.id);if(!i)return;
    i.done=!i.done;i.doneAt=i.done?Date.now():0;save();render();
    if(i.done)toast(`✓ ${i.name}`,()=>{i.done=false;i.doneAt=0;save();render()});
    try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
  },
  newList(){openModal(`<h3>Começar nova lista?</h3><p>A lista atual (${S.current.items.length} itens) vai para o histórico. Lá ficam guardadas as 2 últimas.</p>
    <button class="btn" data-act="newListOk">Sim, nova lista</button><button class="btn sec" data-act="close">Cancelar</button>`)},
  newListOk(){snapshot(S.current);S.current=newList();save();closeModal();tab="montar";render();toast("Nova lista criada")},
  close(){closeModal()},
  histView(el){const ix=+el.dataset.i;const l=S.history[ix];if(!l)return;view={items:JSON.parse(JSON.stringify(l.items)).map(i=>({...i,done:false})),hist:true,hi:ix};render();scrollTo(0,0)},
  histUse(el){
    const ix=+el.dataset.i;const l=S.history[ix];if(!l)return;
    openModal(`<h3>Voltar a usar esta lista?</h3><p>${l.items.length} itens de ${dtf(l.created)}. Sua lista atual vai para o histórico.</p>
     <label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="unmark" checked> Desmarcar todos os itens</label>
     <button class="btn" data-act="histUseOk" data-i="${ix}">Usar esta lista</button><button class="btn sec" data-act="close">Cancelar</button>`);
  },
  histUseOk(el){
    const ix=+el.dataset.i;const l=JSON.parse(JSON.stringify(S.history[ix]));const unmark=$("#unmark").checked;
    S.history.splice(ix,1);snapshot(S.current);
    l.items.forEach(i=>{if(unmark){i.done=false;i.doneAt=0}});delete l.from;
    S.current=l;save();closeModal();view=null;tab="lista";render();toast("Lista restaurada");
  },
  share(){
    const L=S.current.items;if(!L.length)return;
    const data={v:1,f:S.name||"",d:S.current.created,i:L.map(i=>[i.name,cat(i.cat).name,i.qty||"",i.note||""])};
    const url=location.origin+location.pathname+"#importar="+b64e(data);
    const txt=`🛒 Lista de mercado${S.name?" do(a) "+S.name:""} (${L.length} itens). Abra no app Lista de Mercado:`;
    shareOrCopy({title:"Lista de mercado",text:txt,url},txt+"\n"+url);
  },
  shareText(){
    const L=S.current.items;if(!L.length)return;
    let t=`🛒 *Lista de mercado* — ${new Date().toLocaleDateString("pt-BR")}\n`;
    grouped(L).forEach(g=>{t+=`\n${g.c.emo} *${g.c.name}*\n`+g.items.map(i=>`• ${i.name}${i.qty?" ("+i.qty+")":""}${i.note?" – "+i.note:""}`).join("\n")+"\n"});
    shareOrCopy({title:"Lista de mercado",text:t},t,true);
  },
  imp(){
    const v=view;if(!v)return;
    openModal(`<h3>Importar lista${v.from?" de "+esc(v.from):""}?</h3><p>${v.items.length} itens. Sua lista atual vai para o histórico, então nada se perde.</p>
      <button class="btn" data-act="impOk">Importar</button><button class="btn sec" data-act="close">Cancelar</button>`);
  },
  impOk(){
    const v=view;snapshot(S.current);S.current=newList();
    v.items.forEach(x=>{
      let it=S.master.find(m=>norm(m.name)===norm(x.name));
      if(!it){it={id:uid(),name:x.name,cat:x.cat};S.master.push(it)}
      if(!inList(it.id))S.current.items.push({mid:it.id,name:it.name,cat:it.cat,qty:x.qty||"",note:x.note||"",done:false,price:null});
    });
    save();closeModal();view=null;tab="lista";render();toast("Lista importada ✓");
  },
  viewCheck(el){const i=view.items[+el.dataset.i];i.done=!i.done;render()},
  viewClose(){view=null;render()},
  catUp(el){const i=+el.dataset.i;if(i>0){[S.cats[i-1],S.cats[i]]=[S.cats[i],S.cats[i-1]];save();render()}},
  catDown(el){const i=+el.dataset.i;if(i<S.cats.length-1){[S.cats[i+1],S.cats[i]]=[S.cats[i],S.cats[i+1]];save();render()}},
  catEdit(el){
    const c=S.cats[+el.dataset.i];
    openModal(`<h3>Editar categoria</h3><div style="display:flex;gap:8px"><input class="f" id="ce" value="${esc(c.emo)}" style="width:70px;text-align:center"><input class="f" id="cn" value="${esc(c.name)}"></div>
     <button class="btn" data-act="catSave" data-i="${el.dataset.i}">Salvar</button>${S.cats.length>1?`<button class="btn red" data-act="catDel" data-i="${el.dataset.i}">Excluir categoria</button><div class="muted">Os itens dela vão para a última categoria.</div>`:""}`);
  },
  catSave(el){const c=S.cats[+el.dataset.i];const n=$("#cn").value.trim();if(!n)return;c.name=n;c.emo=$("#ce").value.trim()||"📦";save();closeModal();render()},
  catDel(el){
    const ix=+el.dataset.i;const c=S.cats.splice(ix,1)[0];const to=S.cats[S.cats.length-1].id;
    S.master.forEach(m=>{if(m.cat===c.id)m.cat=to});S.current.items.forEach(m=>{if(m.cat===c.id)m.cat=to});
    save();closeModal();render();
  },
  catAdd(){openModal(`<h3>Nova categoria</h3><div style="display:flex;gap:8px"><input class="f" id="ce" value="📦" style="width:70px;text-align:center"><input class="f" id="cn" placeholder="Nome (ex: Bebê)"></div>
    <button class="btn" data-act="catAddOk">Criar</button>`)},
  catAddOk(){const n=$("#cn").value.trim();if(!n)return;S.cats.push({id:uid(),emo:$("#ce").value.trim()||"📦",name:n});save();closeModal();render()},
  backup(){const t="LISTAMERCADO:"+b64e(S);copy(t).then(ok=>toast(ok?"Backup copiado. Cole no WhatsApp ou num bloco de notas.":"Não deu para copiar"))},
  restore(){openModal(`<h3>Restaurar backup</h3><div class="muted">Cole aqui o texto do backup (começa com LISTAMERCADO:)</div><textarea class="f" id="rb"></textarea>
    <button class="btn" data-act="restoreOk">Restaurar</button><div class="muted">Isso substitui todos os dados deste celular.</div>`)},
  restoreOk(){
    try{const t=$("#rb").value.trim().replace(/^LISTAMERCADO:/,"");const d=b64d(t);if(!d.cats||!d.master)throw 0;S=d;save();closeModal();render();toast("Backup restaurado ✓")}
    catch(e){toast("Texto de backup inválido")}
  },
  /* ---------- preço ---------- */
  price(el){
    const i=inList(el.dataset.id);if(!i)return;priceItem=i;
    openModal(`<h3>Preço · ${esc(i.name)}</h3>
     <button class="btn" data-act="scan">📷 Ler etiqueta com a câmera</button>
     <div id="ocr" class="muted"></div><div class="cands" id="cands"></div>
     <div class="muted">ou digite:</div><input class="f" id="pv" inputmode="decimal" placeholder="0,00" value="${i.price?String(i.price.toFixed(2)).replace(".",","):""}" style="font-size:22px">
     <div class="btns"><button class="btn" data-act="priceSave">Salvar</button>${i.price?`<button class="btn red" data-act="priceClear">Apagar</button>`:""}</div>`);
  },
  scan(){$("#cam").value="";$("#cam").click()},
  pick(el){$("#pv").value=el.dataset.v},
  priceSave(){
    if(!priceItem)return;const v=parseFloat(($("#pv").value||"").replace(/\s/g,"").replace(",","."));
    priceItem.price=isFinite(v)&&v>0?Math.round(v*100)/100:null;
    if(priceItem.price&&!priceItem.done){priceItem.done=true;priceItem.doneAt=Date.now()}
    save();closeModal();render();
  },
  priceClear(){if(priceItem){priceItem.price=null;save()}closeModal();render()}
};
let priceItem=null;

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");
  if(t){tab=t.dataset.tab;view=null;editMode=false;render();scrollTo(0,0);return}
  const a=e.target.closest("[data-act]");
  if(a&&A[a.dataset.act]){e.preventDefault();e.stopPropagation();A[a.dataset.act](a)}
});
// segurar o item (meio segundo) abre a quantidade
let lpTimer=null,lpFired=false,lpX=0,lpY=0;
document.addEventListener("pointerdown",e=>{
  const c=e.target.closest(".chip");lpFired=false;clearTimeout(lpTimer);
  if(!c||editMode)return;lpX=e.clientX;lpY=e.clientY;
  lpTimer=setTimeout(()=>{lpFired=true;try{navigator.vibrate&&navigator.vibrate(30)}catch(_){}A.edit(c)},500);
});
const lpCancel=()=>clearTimeout(lpTimer);
document.addEventListener("pointerup",lpCancel);document.addEventListener("pointercancel",lpCancel);
document.addEventListener("pointermove",e=>{if(Math.abs(e.clientX-lpX)>10||Math.abs(e.clientY-lpY)>10)lpCancel()});
document.addEventListener("contextmenu",e=>{if(e.target.closest(".chip"))e.preventDefault()});
document.addEventListener("click",e=>{if(lpFired&&e.target.closest(".chip")){lpFired=false;e.preventDefault();e.stopPropagation()}},true);
document.addEventListener("input",e=>{
  if(e.target.id==="q"){q=e.target.value;refreshMontar()}
  if(e.target.id==="nm"){S.name=e.target.value.trim();save()}
});
document.addEventListener("toggle",e=>{
  const d=e.target;if(d.tagName==="DETAILS"&&d.dataset.cat){d.open?openCats.add(d.dataset.cat):openCats.delete(d.dataset.cat)}
},true);

/* ================= UTILITÁRIOS ================= */
function b64e(o){const b=new TextEncoder().encode(JSON.stringify(o));let s="";for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function b64d(t){t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";const s=atob(t);const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return JSON.parse(new TextDecoder().decode(b))}
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){
  try{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();return ok}catch(_){return false}}}
async function shareOrCopy(data,fallback,wa){
  if(navigator.share){try{await navigator.share(data);return}catch(e){if(e&&e.name==="AbortError")return}}
  const ok=await copy(fallback);
  openModal(`<h3>${ok?"Copiado ✓":"Compartilhar"}</h3><p>${ok?"Agora é só colar no WhatsApp.":"Copie o texto abaixo:"}</p>
   ${ok?"":`<textarea class="f">${esc(fallback)}</textarea>`}
   <a class="btn" href="https://wa.me/?text=${encodeURIComponent(fallback)}" target="_blank" rel="noopener">Abrir WhatsApp</a>
   <button class="btn sec" data-act="close">Fechar</button>`);
}
// tela sempre ligada no modo mercado
let wl=null,wantWake=false;
async function wake(on){
  wantWake=on;
  try{
    if(on&&!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}
    if(!on&&wl){await wl.release();wl=null}
  }catch(e){wl=null}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&wantWake)wake(true)});

/* ================= LEITURA DE PREÇO (OCR) ================= */
let tessP=null;
function loadTess(){
  if(window.Tesseract)return Promise.resolve();
  if(!tessP)tessP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";s.onload=res;s.onerror=()=>{tessP=null;rej(new Error("load"))};document.head.appendChild(s)});
  return tessP;
}
async function prepImage(file){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});
  const max=1600,sc=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  const x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){let g=.3*p[i]+.59*p[i+1]+.11*p[i+2];g=Math.max(0,Math.min(255,(g-128)*1.5+128));p[i]=p[i+1]=p[i+2]=g}
  x.putImageData(d,0,0);return c;
}
function priceCands(data){
  const out=[];const add=(v,h)=>{if(v>0&&v<10000&&!out.some(o=>Math.abs(o.v-v)<.001))out.push({v,h})};
  const fix=s=>String(s).replace(/[Oo]/g,"0").replace(/[lI|]/g,"1");
  const W=(data.words||[]).map(w=>({t:fix(w.text),h:w.bbox?w.bbox.y1-w.bbox.y0:0}));
  W.forEach(w=>{const m=w.t.match(/(\d{1,4})[,.](\d{2})(?!\d)/);if(m)add(+(m[1]+"."+m[2]),w.h)});
  for(let i=0;i<W.length-1;i++){
    const a=W[i].t.replace(/^R\$?/i,"").replace(/[,.]$/,""),b=W[i+1].t.match(/^[,.]?(\d{2})$/);
    if(/^\d{1,4}$/.test(a)&&b)add(+(a+"."+b[1]),W[i].h);
  }
  const re=/(\d{1,4})\s?[,.]\s?(\d{2})(?!\d)/g;let m;const txt=fix(data.text||"");
  while((m=re.exec(txt)))add(+(m[1]+"."+m[2]),0);
  return out.sort((x,y)=>y.h-x.h).slice(0,4);
}
$("#cam").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const st=$("#ocr");if(!st)return;
  st.textContent="⏳ Lendo a etiqueta... (a primeira vez demora um pouco e precisa de internet)";
  try{
    await loadTess();const c=await prepImage(f);
    const r=await Tesseract.recognize(c,"por");
    const cs=priceCands(r.data);
    if(!$("#ocr"))return;
    if(!cs.length){$("#ocr").textContent="Não encontrei um preço na foto. Tente mais perto da etiqueta ou digite abaixo.";return}
    $("#ocr").textContent=cs.length>1?"Toque no preço certo:":"Encontrei este preço (confira):";
    $("#cands").innerHTML=cs.map(o=>`<button data-act="pick" data-v="${o.v.toFixed(2).replace(".",",")}">${brl(o.v)}</button>`).join("");
    $("#pv").value=cs[0].v.toFixed(2).replace(".",",");
  }catch(err){if($("#ocr"))$("#ocr").textContent="Não consegui ler agora (sem internet?). Digite o preço abaixo."}
});

/* ================= LINK RECEBIDO ================= */
function checkHash(){
  const h=location.hash;if(!h.startsWith("#importar="))return;
  try{
    const d=b64d(h.slice(10));
    const items=d.i.map(([name,cn,qty,note])=>{
      let c=S.cats.find(c=>norm(c.name)===norm(cn));
      const m=S.master.find(m=>norm(m.name)===norm(name));
      return{mid:uid(),name,cat:m?m.cat:(c?c.id:S.cats[S.cats.length-1].id),qty,note,done:false};
    });
    view={items,from:d.f||""};
  }catch(e){toast("Link de lista inválido")}
  history.replaceState(null,"",location.pathname);
}
window.addEventListener("hashchange",()=>{checkHash();render()});
checkHash();render();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}
